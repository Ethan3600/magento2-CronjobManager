name: ExtDN M2 Unit Tests
on:
  push:
    branches:
      - 0.x
      - 1.x
      - 2.x
  pull_request:
    branches:
      - 0.x
      - 1.x
      - 2.x

jobs:
  unit-tests-mage249:
    name: Magento 2 Unit Tests (M 2.4.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extdn/github-actions-m2/magento-unit-tests/8.4@master
        env:
          MODULE_NAME: EthanYehuda_CronjobManager
          COMPOSER_NAME: ethanyehuda/magento2-cronjobmanager
          COMPOSER_VERSION: 2
          MAGENTO_VERSION: '2.4.9'

  unit-tests-mage248:
    name: Magento 2 Unit Tests (M 2.4.8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-unit-tests/8.4@master
        with:
          module_name: EthanYehuda_CronjobManager
          composer_name: ethanyehuda/magento2-cronjobmanager
          magento_version: 2.4.8
          block_insecure: false

